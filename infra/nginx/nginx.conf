events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting (defense in depth — the app layer rate limits auth/checkout)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/s;
    limit_req_status 429;

    # Upstreams
    upstream fastapi_backend {
        server api:8000;
    }
    upstream storefront_frontend {
        server storefront:3000;
    }
    upstream admin_frontend {
        server admin:3100;
    }

    # ------------------------------------------------------------------
    # Shared TLS + security headers
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    map $sent_http_content_type $csp {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.cashfree.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.elektrix.in https://api.cashfree.com https://sandbox.cashfree.com; frame-src https://checkout.cashfree.com https://www.cashfree.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.cashfree.com https://sandbox.cashfree.com";
    }

    # ------------------------------------------------------------------
    # HTTP: ACME webroot for all hosts, everything else redirects to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name elektrix.in www.elektrix.in admin.elektrix.in api.elektrix.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Storefront: elektrix.in (+ www redirect)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name www.elektrix.in;

        ssl_certificate /etc/letsencrypt/live/elektrix.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elektrix.in/privkey.pem;

        return 301 https://elektrix.in$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name elektrix.in;

        ssl_certificate /etc/letsencrypt/live/elektrix.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elektrix.in/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;

        location /_next/static/ {
            proxy_pass http://storefront_frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general_limit burst=60 nodelay;
            proxy_pass http://storefront_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Admin console: admin.elektrix.in
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name admin.elektrix.in;

        ssl_certificate /etc/letsencrypt/live/admin.elektrix.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.elektrix.in/privkey.pem;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location /_next/static/ {
            proxy_pass http://admin_frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general_limit burst=60 nodelay;
            proxy_pass http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # API: api.elektrix.in
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.elektrix.in;

        ssl_certificate /etc/letsencrypt/live/api.elektrix.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.elektrix.in/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Never cache API responses at the edge
        add_header Cache-Control "no-store" always;

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
