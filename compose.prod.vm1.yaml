# Production Docker stack for ELEKTRIX v0.2 (Oracle ARM VPS)
#
# Services: nginx (TLS edge) → storefront (elektrix.in) + admin (admin.elektrix.in)
#           → api (api.elektrix.in) + workers → Supabase PostgreSQL + Redis
x-default-env: &default-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - storefront
      - admin
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/elektrix/api:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      <<: *default-env
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.elektrix.in/api/v1}
    image: ghcr.io/elektrix/storefront:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  admin:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.elektrix.in/api/v1}
    image: ghcr.io/elektrix/web:${IMAGE_TAG:-latest}
    expose:
      - "3100"
    environment:
      - PORT=3100
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    image: ghcr.io/elektrix/workers:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      <<: *default-env
      PYTHONPATH: /app/apps/api:/app/apps/workers
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  redis_data:
