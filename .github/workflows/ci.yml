name: ELEKTRIX CI Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  # ---------------------------------------------------------------------
  # SECURITY GATES — every push and PR is scanned for credentials,
  # vulnerable dependencies and high-severity code smells.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Security · Secret Scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  credential-patterns:
    name: Security · Credential Pattern Gate (DSNs, keys, tokens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        run: bash scripts/security/check_secrets.sh

  sast-backend:
    name: Security · Static Analysis (bandit, high severity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Scan backend for high-severity issues
        run: bandit -r apps/api -x apps/api/tests -lll -q
        # -lll = report HIGH severity only; medium/low findings are tracked
        # in the codebase and reduced over time. Add skips with an inline
        # '# nosec <id>' comment plus a justification.

  audit-python-deps:
    name: Security · Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt (fails on known CVEs with fixes)
        run: |
          pip-audit -r apps/api/requirements.txt --progress-spinner off -f json -o audit.json || true
          python3 -c "
          import json
          d = json.load(open('audit.json'))
          fixable = []
          for dep in d.get('dependencies', []):
              for v in dep.get('vulns', []):
                  if v.get('fix_versions'):
                      fixable.append(f\"{dep['name']} {v['id']} -> fixed in {', '.join(v['fix_versions'])}\")
          if fixable:
              print('Vulnerable dependencies with available fixes:')
              print('\n'.join(fixable))
              raise SystemExit(1)
          print('No fixable Python dependency vulnerabilities.')
          "

  audit-npm:
    name: Security · NPM Dependency Audit (high+)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ storefront, admin ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Audit dependencies (fails on high/critical)
        working-directory: ${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------
  # BUILD & TEST GATES
  # ---------------------------------------------------------------------
  validate-docker:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Dummy Env File
        run: cp .env.example .env

      - name: Validate Dev Compose Config
        run: docker compose -f compose.dev.yaml config

      - name: Validate Prod Compose Config
        run: docker compose -f compose.prod.vm1.yaml config

  verify-backend:
    name: Backend Lint, Dependencies & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then
            pip install -r apps/api/requirements.txt
          fi
          # Install testing dependencies
          pip install pytest pytest-asyncio httpx

  backend-tests:
    name: Backend Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ELEKTRIX backend integration suite
        run: bash scripts/run_backend_tests.sh
        env:
          API_IMAGE: elektrix-api:cibuild
      # The script builds the API image, boots scratch Postgres+Redis,
      # migrates, applies RLS, seeds the store and runs the full pytest suite.

  verify-storefront:
    name: Customer Storefront Lint & Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Compile production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.elektrix.in/api/v1

  verify-admin-dashboard:
    name: Admin Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Compile production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.elektrix.in/api/v1
