name: ELEKTRIX CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docker:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Dummy Env File
        run: cp .env.example .env

      - name: Validate Dev Compose Config
        run: docker compose -f compose.dev.yaml config

      - name: Validate Prod Compose Config
        run: docker compose -f compose.prod.vm1.yaml config

  verify-backend:
    name: Backend Lint, Dependencies & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then
            pip install -r apps/api/requirements.txt
          fi
          # Install testing dependencies
          pip install pytest pytest-asyncio httpx

  backend-tests:
    name: Backend Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ELEKTRIX backend integration suite
        run: bash scripts/run_backend_tests.sh
        env:
          API_IMAGE: elektrix-api:cibuild
      # The script builds the API image, boots scratch Postgres+Redis,
      # migrates, applies RLS, seeds the store and runs the full pytest suite.

  verify-storefront:
    name: Customer Storefront Lint & Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Compile production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.elektrix.in/api/v1

  verify-admin-dashboard:
    name: Admin Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Compile production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.elektrix.in/api/v1
