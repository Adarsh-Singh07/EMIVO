name: ELEKTRIX UI Quality Gate (Phase 6)

# Read-only smoke + axe accessibility checks against the live storefront.
# Safe on every push: GET navigations only, no auth, no mutations.
# This gate exists to catch regressions like the 2026-10-03 PDP mobile
# blowout (stretched CTAs off-screen) before they reach users.

on:
  push:
    branches: [main]
    paths:
      - "storefront/**"
      - ".github/workflows/ui-quality.yml"
  workflow_dispatch:

jobs:
  smoke-and-a11y:
    name: Smoke + axe (mobile & desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        working-directory: storefront
        run: npm ci

      - name: Install Playwright browsers
        working-directory: storefront
        run: npx playwright install --with-deps chromium

      # Vercel ships asynchronously — wait until THIS commit's build is what
      # elektrix.in serves (the layout exposes <meta name="build">), so the
      # gate never tests a stale deployment.
      - name: Wait for Vercel deploy of this commit
        run: |
          for i in $(seq 1 40); do
            SHA=$(curl -s https://elektrix.in | grep -o '<meta name="build" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"//')
            echo "poll $i: served build = ${SHA:-none}"
            if [ "$SHA" = "$GITHUB_SHA" ]; then echo "Deploy is live"; exit 0; fi
            sleep 15
          done
          echo "::warning::Timed out waiting for deploy — running against latest anyway"

      - name: Run smoke + axe suite
        working-directory: storefront
        env:
          BASE_URL: https://elektrix.in
          CI: "1"
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storefront/playwright-report/
          retention-days: 7
