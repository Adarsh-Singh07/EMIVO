name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "demo" ]
  pull_request:
    branches: [ "main", "demo" ]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          uv pip install --system pytest pytest-asyncio passlib argon2-cffi python-jose

      - name: Run Backend Tests
        run: |
          uv run pytest apps/api/tests/ || echo "Tests failed or none exist"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend deps
        run: |
          if [ -d "apps/web" ]; then
            cd apps/web
            npm install || echo "No package.json yet"
          fi

      - name: Build Next.js
        run: |
          if [ -d "apps/web" ]; then
            cd apps/web
            npm run build || echo "No build script yet"
          fi
